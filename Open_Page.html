<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Air Traffic Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background: linear-gradient(to bottom, #080172, #000);
            color: white;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        #radar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        #qr-code-placeholder {
            width: 200px;
            height: 200px;
            border: 2px dashed #333;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="radar-container">
        <svg width="100%" height="100%">
            <!-- Radar Rings -->
            <circle cx="50%" cy="50%" r="10%" stroke="#1a5fb4" stroke-width="2" fill="none" />
            <circle cx="50%" cy="50%" r="20%" stroke="#1a5fb4" stroke-width="2" fill="none" />
            <circle cx="50%" cy="50%" r="30%" stroke="#1a5fb4" stroke-width="2" fill="none" />
            <!-- Planes and Routes -->
            <line x1="20%" y1="20%" x2="50%" y2="50%" stroke="#1a5fb4" stroke-width="1" stroke-dasharray="5,5" />
            <circle cx="20%" cy="20%" r="5" fill="#1a5fb4" />
            <line x1="80%" y1="80%" x2="50%" y2="50%" stroke="#1a5fb4" stroke-width="1" stroke-dasharray="5,5" />
            <circle cx="80%" cy="80%" r="5" fill="#1a5fb4" />
        </svg>
    </div>
    <h1>Welcome to the Air Traffic Control Simulator</h1>
    <p>Please scan the QR code below to connect your device.</p>
    <div id="qr-code-placeholder">
        [QR Code Placeholder]
    </div>
    <div id="Start Button">
        <p>Button Goes Here</p>
    </div>
</body>
</html>
