<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Tower Sim</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(to bottom, #080172, #000);
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 24px;
    background: rgba(0, 0, 0, 0.3);
    border-bottom: 1px solid #1a5fb4;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 21px; }
  .muted { color: #8da2b9; font-size: 13px; }
  .muted a { color: inherit; }
  .status { color: #1a5fb4; font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 16px;
    padding: 16px;
  }
  .panel {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid #1a5fb4;
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-title {
    padding: 14px 16px;
    border-bottom: 1px solid #1a5fb4;
    font-weight: 650;
  }
  #radar {
    width: 100%;
    display: block;
    background: rgba(0, 0, 0, 0.2);
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat { padding: 14px; }
  .number { font-size: 25px; font-weight: 700; }
  .content { padding: 14px; }
  .runway {
    padding: 12px;
    border-radius: 7px;
    background: #1b2938;
    margin-bottom: 10px;
  }
  .log {
    height: 280px;
    overflow-y: auto;
    font: 12px/1.7 monospace;
    overflow-wrap: anywhere;
  }
  button {
    border: 1px solid #38516b;
    border-radius: 7px;
    padding: 9px 12px;
    color: #e2e8f0;
    background: #203449;
    cursor: pointer;
  }
  button:hover { background: #2b4965; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 12px 16px;
  }
  @media (max-width: 750px) {
    main { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>✈ ATC Control Tower</h1>
    <div class="muted"><a href="/">MULTIPLAYER AIRSPACE SIMULATOR</a></div>
  </div>
  <div class="status" id="connectionStatus">● CONNECTING…</div>
</header>

<main>
  <section>
    <div class="stats">
      <div class="panel stat">
        <div class="muted">Aircraft</div>
        <div class="number" id="aircraftCount">0</div>
      </div>
      <div class="panel stat">
        <div class="muted">Landings</div>
        <div class="number" id="landingCount">0</div>
      </div>
      <div class="panel stat">
        <div class="muted">Conflicts</div>
        <div class="number" id="conflictCount">0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Live Radar</div>
      <canvas id="radar" width="800" height="540"></canvas>
      <div class="toolbar">
        <span class="muted">SIMULATED AIRCRAFT</span>
        <div>
          <button id="spawn">+ Add aircraft</button>
          <button id="pause">Pause</button>
        </div>
      </div>
    </div>
  </section>

  <aside>
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-title">Runway Status</div>
      <div class="content" id="runways"></div>
    </div>

    <div class="panel">
      <div class="panel-title">Tower Event Log</div>
      <div class="content log" id="log"></div>
    </div>
  </aside>
</main>

<script>
const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("connectionStatus");
const pauseButton = document.getElementById("pause");

// Shared airspace state, owned by the Python server. Every radar connected
// to the same server receives the same planes.
let planes = [];
let airports = [];
let landings = 0;
let paused = false;
let socket = null;
let lastTime = performance.now();

// Pilot requests from cockpit devices are highlighted on the radar.
const STATUS_COLORS = {
  AWAITING_CLEARANCE: "#f6d32d",
  APPROACH: "#8ff0a4",
  HOLDING: "#ffa348",
};
const EMERGENCY_COLOR = "#ff4d5e";

function log(message) {
  const line = document.createElement("div");
  const time = new Date().toLocaleTimeString();
  line.textContent = `[${time}] ${message}`;
  document.getElementById("log").prepend(line);
}

function setStatus(online) {
  statusEl.textContent = online ? "● SIMULATION ONLINE" : "● CONNECTING…";
  statusEl.style.color = online ? "#1a5fb4" : "#e5a50a";
}

function send(type) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type }));
  } else {
    log("Not connected to server");
  }
}

function applyState(state) {
  const previous = new Map(planes.map(p => [p.id, p]));
  const current = new Set(state.planes.map(p => p.id));

  for (const p of state.planes) {
    const old = previous.get(p.id);
    if (!old) log(`Flight ${p.callsign} entered airspace → ${p.destination}`);
    else if (p.callsign !== old.callsign) log(`Flight ${old.callsign} is now ${p.callsign}`);
    else if (p.status !== old.status) log(`Flight ${p.callsign} ${p.status.replace(/_/g, " ")}`);
    if (old && p.emergency !== old.emergency) {
      log(p.emergency ? `⚠ MAYDAY declared by ${p.callsign}` : `Flight ${p.callsign} cancelled emergency`);
    }
    if (old && p.target_altitude > old.target_altitude) {
      log(`Flight ${p.callsign} climbing to ${p.target_altitude.toLocaleString()} ft`);
    }
  }
  for (const p of planes) {
    if (current.has(p.id)) continue;
    const airport = airports.find(a => a.code === p.destination);
    if (p.status === "APPROACH" && airport) log(`Flight ${p.callsign} landed at ${airport.name}`);
    else log(`Flight ${p.callsign} left airspace`);
  }

  airports = state.airports;
  renderRunways();

  if (state.paused !== paused) {
    log(state.paused ? "Simulation paused" : "Simulation resumed");
  }

  planes = state.planes;
  landings = state.landings;
  paused = state.paused;
  pauseButton.textContent = paused ? "Resume" : "Pause";
  updateStats();
}

function connect() {
  const protocol = location.protocol === "https:" ? "wss" : "ws";
  socket = new WebSocket(`${protocol}://${location.host}/ws/tower`);

  socket.addEventListener("open", () => {
    setStatus(true);
    log("Connected to tower server");
  });

  socket.addEventListener("message", event => {
    const message = JSON.parse(event.data);
    if (message.type === "state") applyState(message);
    else if (message.type === "error") log(`Server error: ${message.message}`);
  });

  socket.addEventListener("close", () => {
    setStatus(false);
    log("Lost connection to server, retrying…");
    setTimeout(connect, 2000);
  });
}

function renderRunways() {
  const container = document.getElementById("runways");
  container.replaceChildren(...airports.map(a => {
    const card = document.createElement("div");
    card.className = "runway";
    const title = document.createElement("strong");
    title.textContent = `${a.runway} · ${a.name}`;
    const status = document.createElement("div");
    status.className = "muted";
    status.textContent = a.occupant ? `Occupied: ${a.occupant} landing` : "Available";
    card.append(title, status);
    if (a.queue.length) {
      const queue = document.createElement("div");
      queue.className = "muted";
      queue.textContent = `Holding for landing: ${a.queue.join(", ")}`;
      card.append(queue);
    }
    return card;
  }));
}

function updateStats() {
  document.getElementById("aircraftCount").textContent = planes.length;
  document.getElementById("landingCount").textContent = landings;
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Radar grid
  ctx.strokeStyle = "rgba(26, 95, 180, 0.3)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= w; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y <= h; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  // Airports and runways. RWY 09 runs east-west; RWY 18 and 36 north-south.
  for (const a of airports) {
    const horizontal = a.runway === "RWY 09";
    const len = horizontal ? 130 : 70;
    ctx.fillStyle = a.occupant ? "#26a269" : "#1a5fb4";
    if (horizontal) ctx.fillRect(a.x - len / 2, a.y - 9, len, 18);
    else ctx.fillRect(a.x - 7, a.y - len / 2, 14, len);
    ctx.strokeStyle = "#ffffff";
    ctx.setLineDash([9, 7]);
    ctx.beginPath();
    if (horizontal) { ctx.moveTo(a.x - len / 2 + 5, a.y); ctx.lineTo(a.x + len / 2 - 5, a.y); }
    else { ctx.moveTo(a.x, a.y - len / 2 + 5); ctx.lineTo(a.x, a.y + len / 2 - 5); }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#ffffff";
    ctx.font = "12px monospace";
    const label = a.name.toUpperCase();
    if (horizontal) ctx.fillText(label, a.x - ctx.measureText(label).width / 2, a.y + 30);
    else ctx.fillText(label, a.x + 14, a.y + 4);
  }

  // Aircraft markers
  for (const p of planes) {
    const color = p.emergency ? EMERGENCY_COLOR : STATUS_COLORS[p.status] || "#ffffff";
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.35, p.y - p.vy * 0.35);
    ctx.stroke();

    ctx.font = "12px monospace";
    ctx.fillText(p.callsign, p.x + 15, p.y - 9);
    const climbing = p.altitude < p.target_altitude;
    const flightLevel = String(Math.round(p.altitude / 100)).padStart(3, "0");
    ctx.fillText(`FL${flightLevel}${climbing ? "↑" : p.status === "APPROACH" ? "↓" : ""}`,
      p.x + 15, p.y + 5);
  }

  requestAnimationFrame(draw);
}

// The server moves planes 10 times a second; between updates, extrapolate
// locally so the radar stays smooth. The next server state corrects any drift.
function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (!paused) {
    for (const p of planes) {
      p.x = Math.max(15, Math.min(canvas.width - 15, p.x + p.vx * dt));
      p.y = Math.max(15, Math.min(canvas.height - 15, p.y + p.vy * dt));
    }
  }

  requestAnimationFrame(animate);
}

document.getElementById("spawn").addEventListener("click", () => send("SPAWN_PLANE"));
pauseButton.addEventListener("click", () => send("TOGGLE_PAUSE"));

log("Tower simulation initialized");
setStatus(false);
connect();
draw();
requestAnimationFrame(animate);
</script>
</body>
</html>
