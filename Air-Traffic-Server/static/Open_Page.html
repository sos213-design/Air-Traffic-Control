<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Air Traffic Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background: linear-gradient(to bottom, #080172, #000);
            color: white;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        #radar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        #qr-code {
            width: 200px;
            height: 200px;
            margin: 20px auto 8px;
            padding: 8px;
            display: block;
            background: #fff;
            border-radius: 8px;
        }
        #join-url {
            font-family: monospace;
            color: #99c1f1;
            overflow-wrap: anywhere;
        }
        #start-button {
            display: inline-block;
            margin: 20px 0 10px;
            padding: 14px 28px;
            border: 1px solid #1a5fb4;
            border-radius: 8px;
            background: #1a5fb4;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }
        #start-button:hover { background: #2a6fc4; }
        a { color: #99c1f1; }
        .muted { color: #8da2b9; font-size: 14px; }
    </style>
</head>
<body>
    <div id="radar-container">
        <svg width="100%" height="100%">
            <!-- Radar Rings -->
            <circle cx="50%" cy="50%" r="10%" stroke="#1a5fb4" stroke-width="2" fill="none" />
            <circle cx="50%" cy="50%" r="20%" stroke="#1a5fb4" stroke-width="2" fill="none" />
            <circle cx="50%" cy="50%" r="30%" stroke="#1a5fb4" stroke-width="2" fill="none" />
            <!-- Planes and Routes -->
            <line x1="20%" y1="20%" x2="50%" y2="50%" stroke="#1a5fb4" stroke-width="1" stroke-dasharray="5,5" />
            <circle cx="20%" cy="20%" r="5" fill="#1a5fb4" />
            <line x1="80%" y1="80%" x2="50%" y2="50%" stroke="#1a5fb4" stroke-width="1" stroke-dasharray="5,5" />
            <circle cx="80%" cy="80%" r="5" fill="#1a5fb4" />
        </svg>
    </div>
    <h1>Welcome to the Air Traffic Control Simulator</h1>
    <p>Please scan the QR code below to connect your device.</p>
    <img id="qr-code" src="/qr.svg" alt="QR code to join as a pilot">
    <p class="muted">or open <a id="join-url" href="/cockpit">/cockpit</a> on your device</p>
    <p><span id="aircraft-count">0</span> aircraft in the airspace</p>
    <a id="start-button" href="/tower">Start Control Tower</a>
    <script>
        fetch("/api/join")
            .then(response => response.json())
            .then(({ url }) => {
                const link = document.getElementById("join-url");
                link.href = url;
                link.textContent = url;
            })
            .catch(() => {});

        // Live aircraft count from the server's radar feed.
        function watchAirspace() {
            const protocol = location.protocol === "https:" ? "wss" : "ws";
            const socket = new WebSocket(`${protocol}://${location.host}/ws/tower`);
            socket.addEventListener("message", event => {
                const message = JSON.parse(event.data);
                if (message.type === "state") {
                    document.getElementById("aircraft-count").textContent = message.planes.length;
                }
            });
            socket.addEventListener("close", () => setTimeout(watchAirspace, 2000));
        }
        watchAirspace();
    </script>
</body>
</html>
